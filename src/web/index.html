<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Heroes V lobby</title>
    <style>
      /* No fonts, no frameworks, no build step: the page is served by a service that
         must not reach the database, and it may as well not reach the internet either. */
      :root {
        --ink: #e6e2d8;
        --dim: #948d7e;
        --back: #14130f;
        --panel: #1d1b16;
        --edge: #33302a;
        --gold: #d8b45a;
        --web: #66ccff;
        --server: #b18cff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        background: var(--back);
        color: var(--ink);
        font: 15px/1.5 system-ui, sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--edge);
        background: var(--panel);
      }
      h1 { font-size: 15px; margin: 0 12px 0 0; color: var(--gold); font-weight: 600; letter-spacing: 0.02em; }
      nav { display: flex; gap: 6px; }
      button.tab {
        border: 1px solid var(--edge);
        background: transparent;
        color: var(--dim);
        padding: 4px 12px;
        border-radius: 999px;
        cursor: pointer;
        font: inherit;
      }
      button.tab[aria-selected='true'] { color: var(--back); background: var(--gold); border-color: var(--gold); }
      #who { margin-left: auto; color: var(--dim); font-size: 13px; }
      #who b { color: var(--ink); font-weight: 600; }
      main { display: grid; grid-template-columns: 1fr 220px; min-height: 0; }
      #log { overflow-y: auto; padding: 14px 16px; }
      .line { display: flex; gap: 10px; padding: 2px 0; align-items: baseline; }
      .at { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 12px; }
      .nick { font-weight: 600; }
      .nick.game { color: var(--gold); }
      .nick.web { color: var(--web); }
      .nick.server { color: var(--server); }
      .text { white-space: pre-wrap; word-break: break-word; }
      .divider { color: var(--dim); font-size: 12px; text-align: center; padding: 8px 0; border-top: 1px dashed var(--edge); margin-top: 8px; }
      aside { border-left: 1px solid var(--edge); background: var(--panel); overflow-y: auto; padding: 12px; }
      aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); margin: 0 0 8px; }
      aside ul { list-style: none; margin: 0 0 16px; padding: 0; }
      aside li { padding: 2px 0; }
      aside li.web { color: var(--web); }
      aside li.game { color: var(--gold); }
      aside p { color: var(--dim); font-size: 13px; margin: 0; }
      footer { padding: 10px 16px; border-top: 1px solid var(--edge); background: var(--panel); }
      #composer { display: flex; gap: 8px; }
      input, footer button {
        font: inherit;
        border: 1px solid var(--edge);
        background: var(--back);
        color: var(--ink);
        border-radius: 6px;
        padding: 8px 10px;
      }
      #say { flex: 1; }
      footer button { background: var(--gold); color: var(--back); border-color: var(--gold); font-weight: 600; cursor: pointer; }
      #banner { display: none; padding: 6px 16px; background: #4a2020; color: #ffd9d9; font-size: 13px; }
      #banner.on { display: block; }
      dialog {
        border: 1px solid var(--edge);
        background: var(--panel);
        color: var(--ink);
        border-radius: 10px;
        padding: 20px;
      }
      dialog::backdrop { background: rgba(0, 0, 0, 0.6); }
      dialog h2 { margin: 0 0 4px; font-size: 16px; }
      dialog p { margin: 0 0 14px; color: var(--dim); font-size: 13px; }
      dialog form { display: flex; gap: 8px; }
      dialog button { font: inherit; border-radius: 6px; border: 1px solid var(--gold); background: var(--gold); color: var(--back); padding: 8px 14px; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <header>
      <h1>Heroes V lobby</h1>
      <nav id="tabs"></nav>
      <span id="who"></span>
    </header>
    <div id="banner">the core is not answering — nothing is being sent</div>
    <main>
      <div id="log"></div>
      <aside>
        <h2>In the game</h2>
        <ul id="in-game"></ul>
        <h2>In the browser</h2>
        <ul id="in-web"></ul>
        <p id="nobody">Nobody is here yet.</p>
      </aside>
    </main>
    <!-- A form, so that Enter sends the line the way Enter sends everything else on the
         web. A keydown listener looked equivalent and was not: the pane this was driven
         from never delivered one, and the box quietly ate every message. -->
    <footer>
      <form id="composer">
        <input id="say" placeholder="Say something to the channel…" autocomplete="off" />
        <button id="send" type="submit">Send</button>
      </form>
    </footer>

    <dialog id="ask">
      <h2>What are you called?</h2>
      <p>The same name the game shows, if you want the players to know it is you.</p>
      <form method="dialog">
        <input id="nick" maxlength="24" autocomplete="off" required />
        <button value="ok">Enter</button>
      </form>
    </dialog>

    <script type="module">
      const $ = (id) => document.getElementById(id);
      const log = $('log');
      const tabs = $('tabs');

      let socket = null;
      let nick = localStorage.getItem('h5e-nick') ?? '';
      let channel = localStorage.getItem('h5e-channel') ?? '';
      let channels = [];

      if (!nick) {
        const ask = $('ask');
        // Both the form's submit and the dialog's close, because they are not the same
        // event everywhere: the browser pane this was first driven in never dispatched
        // `close`, and a name box that swallows the name is the whole page not starting.
        // The guard makes the second one a no-op.
        const entered = () => {
          if (nick) return;
          nick = $('nick').value.trim() || 'somebody';
          localStorage.setItem('h5e-nick', nick);
          ask.close();
          connect();
        };
        ask.querySelector('form').addEventListener('submit', (event) => {
          event.preventDefault();
          entered();
        });
        ask.addEventListener('close', entered);
        ask.showModal();
      } else {
        connect();
      }

      function connect() {
        $('who').innerHTML = `you are <b></b>`;
        $('who').querySelector('b').textContent = nick;
        socket = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/`);
        socket.addEventListener('open', () => {
          banner(false);
          socket.send(JSON.stringify({ kind: 'hello', nick, channel: channel || undefined }));
        });
        socket.addEventListener('message', (event) => handle(JSON.parse(event.data)));
        // The web service restarting must not mean reloading the page by hand.
        socket.addEventListener('close', () => {
          banner(true);
          setTimeout(connect, 1500);
        });
      }

      function banner(on) {
        $('banner').classList.toggle('on', on);
      }

      function handle(message) {
        if (message.kind === 'welcome') {
          channels = message.channels;
          if (!channels.some((c) => c.key === channel)) channel = channels[0]?.key ?? '';
          drawTabs();
          banner(!message.core);
        } else if (message.kind === 'core') {
          banner(!message.connected);
        } else if (message.kind === 'history') {
          if (message.channel !== channel) return;
          log.replaceChildren();
          for (const line of message.messages) draw(line);
          if (message.messages.length) {
            const mark = document.createElement('div');
            mark.className = 'divider';
            mark.textContent = 'everything above was said earlier';
            log.append(mark);
          }
          log.scrollTop = log.scrollHeight;
        } else if (message.kind === 'message') {
          draw(message.message);
          log.scrollTop = log.scrollHeight;
        } else if (message.kind === 'presence') {
          drawPresence(message.entries);
        }
      }

      function draw(line) {
        const row = document.createElement('div');
        row.className = 'line';
        const at = document.createElement('span');
        at.className = 'at';
        at.textContent = new Date(line.at).toTimeString().slice(0, 5);
        const who = document.createElement('span');
        who.className = `nick ${line.origin}`;
        who.textContent = line.nick;
        const text = document.createElement('span');
        text.className = 'text';
        text.textContent = line.text;
        row.append(at, who, text);
        log.append(row);
      }

      function drawTabs() {
        tabs.replaceChildren();
        for (const one of channels) {
          const button = document.createElement('button');
          button.className = 'tab';
          button.textContent = one.name;
          button.setAttribute('aria-selected', String(one.key === channel));
          button.addEventListener('click', () => {
            channel = one.key;
            localStorage.setItem('h5e-channel', channel);
            log.replaceChildren();
            drawTabs();
            socket?.send(JSON.stringify({ kind: 'channel', channel }));
          });
          tabs.append(button);
        }
      }

      function drawPresence(entries) {
        const here = entries.filter((entry) => entry.channel === channel);
        const fill = (list, origin) => {
          list.replaceChildren();
          for (const entry of here.filter((one) => one.origin === origin)) {
            const item = document.createElement('li');
            item.className = origin;
            item.textContent = entry.nick;
            list.append(item);
          }
        };
        fill($('in-game'), 'game');
        fill($('in-web'), 'web');
        $('nobody').hidden = here.length > 0;
      }

      function say() {
        const input = $('say');
        const text = input.value.trim();
        if (!text || !socket || socket.readyState !== 1) return;
        socket.send(JSON.stringify({ kind: 'say', text }));
        input.value = '';
      }

      $('composer').addEventListener('submit', (event) => {
        event.preventDefault();
        say();
      });
    </script>
  </body>
</html>
